[logging]
config = test/lacre-logging.conf
file = test/logs/gpg-mailgate.log
format = %(asctime)s %(module)s[%(process)d]: %(message)s
date_format = ISO

[gpg]
keyhome = test/keyhome

[smime]
cert_path = test/certs

[daemon]
host = not_used
port = not_used

[database]
enabled = yes
url = sqlite:///test/lacre.db

[relay]
host = localhost
port = 2500

[cron]
send_email = no
mail_templates = not_used

