[loggers]
keys=root

[logger_root]
level=NOTSET
handlers=lacrelog

[handlers]
keys=lacrelog

[formatters]
keys=postfixfmt

[handler_lacrelog]
class=FileHandler
level=DEBUG
formatter=postfixfmt
args=('test/logs/lacre.log', 'a+')

[formatter_postfixfmt]
format=%(asctime)s %(name)s[%(process)d]: %(message)s
datefmt=%b %e %H:%M:%S
style=%
validate=True
